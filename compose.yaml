services:
  browser-runtime:
    build:
      context: ./docker/browser-runtime
      args:
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}"
    shm_size: "1gb"
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # Scoped seccomp profile: pinned Docker default policy plus argument-filtered
    # Chromium user/PID/network namespace calls. No seccomp=unconfined, SYS_ADMIN,
    # privileged mode, or --no-sandbox.
    security_opt:
      - seccomp=./docker/browser-runtime/seccomp-chromium.json
    expose:
      - "6080"
      - "9222"
    volumes:
      - browser-profile:/data/profile
    restart: unless-stopped

  app-runtime:
    build:
      context: .
      dockerfile: docker/app-runtime/Dockerfile
      args:
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-}"
    depends_on:
      browser-runtime:
        condition: service_healthy
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "3000"
      APP_WEB_ROOT: "/app/web-dist"
      APP_BROWSER_LIVE_VIEW_URL: "/browser-live-view/vnc.html?autoconnect=1&resize=scale"
      APP_BROWSER_LIVE_VIEW_UPSTREAM: "http://browser-runtime:6080"
      APP_MATERIAL_SOURCE: "${APP_MATERIAL_SOURCE:-provider_pipeline}"
      APP_CONTROLLED_MATERIAL_PATH: "/controlled-material/material.json"
      APP_CONTROLLED_ASSET_ROOT: "/controlled-material/assets"
      BROWSER_CDP_ENDPOINT: "http://browser-runtime:9222"
      DATABASE_SQLITE_PATH: "/data/app.db"
      ASSET_STORE_PATH: "/data/assets"
      APP_PI_SESSION_DIR: "/data/pi-sessions"
      PUBLISHER_AI_BASE_URL: "${PUBLISHER_AI_BASE_URL:-}"
      PUBLISHER_AI_API_KEY: "${PUBLISHER_AI_API_KEY:-}"
      PUBLISHER_AI_MODEL: "${PUBLISHER_AI_MODEL:-}"
      XHS_SMOKE_DATA_ROOT: "/data/smoke/xhs-prepare"
    ports:
      # Single product endpoint. Browser Live View is available only through
      # the same-origin /browser-live-view/* application boundary.
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/data
      - ./data/controlled-material:/controlled-material:ro
    healthcheck:
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
    restart: unless-stopped

volumes:
  browser-profile:
  app-data:

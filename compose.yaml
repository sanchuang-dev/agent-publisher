services:
  browser-runtime:
    build:
      context: ./docker/browser-runtime
    shm_size: "1gb"
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # Scoped seccomp profile: Docker's default deny policy plus clone/unshare,
    # the minimum Chromium's namespace sandbox needs. Avoids seccomp=unconfined
    # and requires no extra capability such as SYS_ADMIN.
    security_opt:
      - seccomp=./docker/browser-runtime/seccomp-chromium.json
    expose:
      - "6080"
      - "9222"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - browser-profile:/data/profile
    restart: unless-stopped

volumes:
  browser-profile:

services:
  browser-runtime:
    build:
      context: ./docker/browser-runtime
    shm_size: "1gb"
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # Chromium's namespace sandbox needs clone(CLONE_NEWUSER), which Docker's
    # default seccomp profile denies. Unconfining seccomp adds no capabilities
    # and keeps the browser's own sandbox active (unlike --no-sandbox).
    security_opt:
      - seccomp=unconfined
    expose:
      - "6080"
      - "9222"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - browser-profile:/data/profile
    restart: unless-stopped

volumes:
  browser-profile:

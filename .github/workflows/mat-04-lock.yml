name: MAT-04 Dependency Lock

on:
  push:
    branches:
      - feat/mat-04-safe-layout-renderer

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact lock
        run: |
          npm install --no-audit --no-fund
          node - <<'NODE' > mat-04-package-info.txt
          const fs = require("node:fs");
          const path = require("node:path");
          for (const name of ["@takumi-rs/core", "@fontsource-variable/noto-sans-sc"]) {
            const pkgPath = path.join(process.cwd(), "node_modules", ...name.split("/"), "package.json");
            console.log("PACKAGE " + name + " " + pkgPath);
            console.log(fs.readFileSync(pkgPath, "utf8"));
          }
          const fontRoot = path.join(process.cwd(), "node_modules", "@fontsource-variable", "noto-sans-sc");
          for (const file of fs.readdirSync(path.join(fontRoot, "files")).sort()) {
            if (file.endsWith(".woff2")) {
              console.log("FONT " + file);
            }
          }
          NODE
          cat mat-04-package-info.txt
      - name: Commit generated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock MAT-04 renderer dependencies"
          git push origin HEAD:feat/mat-04-safe-layout-renderer
      - uses: actions/upload-artifact@v4
        with:
          name: mat-04-lock
          path: |
            package-lock.json
            mat-04-package-info.txt

name: MAT-04 Focused Verification

on:
  push:
    branches:
      - feat/mat-04-safe-layout-renderer

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: MAT-04 focused tests
        run: npx vitest run test/builtin-layout-renderer.test.ts

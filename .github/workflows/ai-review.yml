name: Organization AI Review

on:
  pull_request_target:
    branches:
      - dev
      - test
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && vars.AI_REVIEW_ENABLED == 'true' }}
    uses: sanchuang-dev/.github/.github/workflows/ai-review-openai-compatible.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      endpoint: ${{ vars.AI_REVIEW_ENDPOINT }}
      model: ${{ vars.AI_REVIEW_MODEL }}
    secrets:
      api_key: ${{ secrets.AI_REVIEW_API_KEY }}

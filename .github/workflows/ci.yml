name: CI

on:
  pull_request:
    branches:
      - dev
      - test
      - prod
  push:
    branches:
      - dev
      - test
      - prod

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check

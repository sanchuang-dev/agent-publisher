name: CI

on:
  pull_request:
    branches:
      - dev
      - test
      - prod
  push:
    branches:
      - dev
      - test
      - prod

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check
        run: npm run check


  browser-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start browser-runtime
        run: docker compose up -d --build browser-runtime

      - name: Wait for healthy Chromium
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q browser-runtime)"
          test -n "$container_id"

          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs browser-runtime
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          docker compose exec -T browser-runtime curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          docker compose exec -T browser-runtime curl -fsS -X PUT \
            'http://127.0.0.1:9222/json/new?data:text/html,%3Ctitle%3Ebrowser-runtime-ci%3C/title%3E' >/dev/null

      - name: Verify sandbox boundary and live-view endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q browser-runtime)"

          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id" | grep -q 'seccomp'
          ! docker compose exec -T browser-runtime sh -lc "ps -ef | grep '[c]hromium' | grep -q -- '--no-sandbox'"
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null

          # Chromium requires unprivileged user namespaces, but unrelated mount
          # namespace creation must remain denied by the scoped seccomp rule.
          if docker compose exec -T browser-runtime sh -lc 'command -v unshare >/dev/null 2>&1'; then
            if docker compose exec -T browser-runtime gosu browser unshare --mount true; then
              echo "::error::mount namespace creation unexpectedly succeeded"
              exit 1
            fi
          fi

      - name: Browser-runtime logs on failure
        if: failure()
        run: docker compose logs browser-runtime

      - name: Stop browser-runtime
        if: always()
        run: docker compose down


  browser-provider-smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and start browser-runtime
        run: docker compose up -d --build browser-runtime

      - name: Wait for healthy browser-runtime
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q browser-runtime)"
          test -n "$container_id"

          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs browser-runtime
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"

      - name: Verify CDP stays Compose-internal
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q browser-runtime)"
          if docker port "$container_id" 9222/tcp 2>/dev/null | grep -q .; then
            echo "::error::CDP 9222 must not be published to the host"
            docker port "$container_id" 9222/tcp || true
            exit 1
          fi

      - name: Run BrowserProvider and single-session smokes on Compose network
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q browser-runtime)"
          network_name="$(
            docker inspect               --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}'               "$container_id"               | head -n 1
          )"
          test -n "$network_name"

          docker run --rm             --network "$network_name"             --volume "$PWD:/workspace"             --workdir /workspace             --env BROWSER_CDP_ENDPOINT=http://browser-runtime:9222             node:22-bookworm-slim             sh -lc 'npm run smoke:browser-provider && npm run smoke:session-constraint'

      - name: Browser-runtime logs on failure
        if: failure()
        run: docker compose logs browser-runtime

      - name: Stop browser-runtime
        if: always()
        run: docker compose down

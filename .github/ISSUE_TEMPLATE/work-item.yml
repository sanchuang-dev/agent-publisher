name: Work item
description: Engineering work item with a clear scope and acceptance contract.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Keep this Issue focused on the work contract. Project Status, Priority/Effort/dates, assignees, linked PRs, and other GitHub-owned metadata should not be duplicated here.
        Creating this Issue does not by itself authorize implementation, acceptance, closure, release, or deployment.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this work item create?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Current facts, constraints, and relevant links.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What concrete surfaces does this work item own?
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Important exclusions that prevent scope creep.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that must be true for completion.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification / evidence
      description: Tests, CI, build, screenshots, device/runtime checks, deployment evidence, or human checks needed to prove the criteria.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Dependencies / risks
      description: Material blockers, ordering constraints, rollback concerns, or known uncertainty.
    validations:
      required: false

name: Work item
description: Engineering work item with a clear scope and acceptance contract.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Keep this Issue focused on the work contract. Project Status, Priority/Effort/dates, assignees, linked PRs, and other GitHub-owned metadata should not be duplicated here.
        Creating this Issue does not by itself authorize implementation, acceptance, closure, release, or deployment.
        Do not use "Ready for acceptance" as a lifecycle state; leave completed-but-unaccepted work open until an authorized acceptance/closure decision.

  - type: dropdown
    id: work_item_kind
    attributes:
      label: Work item kind
      description: Implementation slices are directly executable. Milestone shells must be decomposed into small child Issues before implementation.
      options:
        - Implementation slice
        - Milestone shell
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What one outcome should this work item create?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Current facts, constraints, relevant links, and dependencies. For an implementation slice include the parent outcome (if any) and explicit implementation base, e.g. "Implementation base: dev".
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What concrete surfaces does this work item own? If independently releasable/verifiable concerns are mixed here, split the work first.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Important exclusions that prevent scope creep.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that must be true for this work item itself to be complete.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification / evidence
      description: Behavioral evidence needed to prove the criteria. CI/AI Review may supplement this evidence but are not product acceptance by themselves.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Dependencies / risks
      description: Material blockers, ordering constraints, rollback concerns, or known uncertainty.
    validations:
      required: false

  - type: textarea
    id: slices
    attributes:
      label: Implementation slices
      description: Required for a Milestone shell. Link the small executable child Issues. If not decomposed yet, state that implementation must not start from this parent.
    validations:
      required: false
